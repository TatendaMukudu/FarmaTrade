name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmatrade
          POSTGRES_PASSWORD: farmatrade
          POSTGRES_DB: farmatrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmatrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://farmatrade:farmatrade@localhost:5432/farmatrade?schema=public
      SESSION_SECRET: ci-only-placeholder-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        # high/critical only — low/moderate advisories in transitive deps
        # are frequently unfixable without an upstream release and would
        # just make this step permanently, unactionably red.
        run: npm audit --audit-level=high

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
