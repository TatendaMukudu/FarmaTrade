services:
  - type: web
    name: farmatrade
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    # preDeployCommand only actually runs if this service is synced from this
    # Blueprint (render.yaml) rather than configured by hand in the dashboard
    # — Render silently ignores it otherwise, which is exactly how migrations
    # stopped applying reliably before. `npm start` now runs
    # `prisma migrate deploy` itself (idempotent, safe to repeat) as the
    # guarantee that doesn't depend on how the service was originally set up.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Not a secret (a DSN can only submit events, not read account data)
      # — committed directly rather than sync:false so there's no manual
      # dashboard step for this one. Both names point at the same DSN:
      # server/edge code reads the bare name, the browser bundle only
      # inlines NEXT_PUBLIC_-prefixed vars.
      - key: SENTRY_DSN
        value: https://6f622575b528452d79c1de9698c4565a@o4511862355656704.ingest.us.sentry.io/4511862363717632
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://6f622575b528452d79c1de9698c4565a@o4511862355656704.ingest.us.sentry.io/4511862363717632
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: production
      # Slugs aren't secret (same reasoning as the DSN); the auth token is
      # — sync:false, set by hand from Sentry's Organization Tokens page.
      - key: SENTRY_ORG
        value: mukudu-ltd
      - key: SENTRY_PROJECT
        value: javascript-nextjs
      - key: SENTRY_AUTH_TOKEN
        sync: false
      # R2 credentials genuinely are secret (unlike the Sentry DSN above) —
      # sync:false, set by hand in Render's dashboard from the values in
      # Cloudflare's R2 > Manage R2 API Tokens.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # Staging: same build, deployed from a separate branch against a separate
  # database, so a migration or a bad deploy shows up here before it ever
  # touches production. This config is ready to sync, but two manual steps
  # remain (no Render/Neon API access from this environment to do them):
  #   1. In Render: New > Blueprint, point at this repo, let it create
  #      "farmatrade-staging" from this block.
  #   2. In Neon: create a branch off the production database (Neon branches
  #      are cheap, copy-on-write — this does not duplicate storage), copy
  #      its connection string into farmatrade-staging's DATABASE_URL.
  - type: web
    name: farmatrade-staging
    runtime: node
    plan: free
    region: oregon
    branch: staging
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SENTRY_DSN
        value: https://6f622575b528452d79c1de9698c4565a@o4511862355656704.ingest.us.sentry.io/4511862363717632
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://6f622575b528452d79c1de9698c4565a@o4511862355656704.ingest.us.sentry.io/4511862363717632
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: staging
      - key: SENTRY_ORG
        value: mukudu-ltd
      - key: SENTRY_PROJECT
        value: javascript-nextjs
      - key: SENTRY_AUTH_TOKEN
        sync: false
      # Point at a separate bucket if you create one for staging — worth
      # doing eventually so a staging test upload never lands next to real
      # user photos, but reusing the production bucket for now is fine too.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
